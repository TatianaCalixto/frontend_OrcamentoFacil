# Configuracao do code-gen (S25-T02).
# field_rename: snake -> mapeia automaticamente camelCase (Dart) <-> snake_case
# (JSON do backend), evitando @JsonKey(name:) em cada campo.
# explicit_to_json: true -> objetos aninhados (ex.: TransactionPage.items)
# serializam via .toJson() corretamente.
targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          explicit_to_json: true
