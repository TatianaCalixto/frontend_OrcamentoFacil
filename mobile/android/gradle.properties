org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Desabilita Kotlin incremental compilation porque o pub cache (C:) e o
# projeto (D:) estao em drives distintos no Windows e o cache incremental
# do Kotlin falha com "files have different roots".
kotlin.incremental=false
