name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  mobile:
    name: Mobile (analyze + test + coverage)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Code generation (freezed/json_serializable) — S25-T01. Arquivos
      # *.freezed.dart/*.g.dart sao gitignored e gerados aqui antes do analyze/test.
      # Obs.: --delete-conflicting-outputs foi removido no build_runner 2.15 (passou
      # a ser o comportamento padrao); por isso usamos apenas `build`.
      - name: Code generation (build_runner)
        run: dart run build_runner build

      # .env e gitignored (segredo); o pubspec declara como asset, entao no CI
      # criamos a partir do exemplo para analyze/test/build encontrarem o asset.
      - name: Prepare .env (from example)
        run: cp .env.example .env

      - name: Analyze (gate)
        run: flutter analyze

      - name: Test (coverage)
        run: flutter test --coverage

      - name: Coverage gate (>= 70%)
        run: |
          python3 - <<'EOF'
          # Exclui arquivos gerados (freezed/json_serializable) da cobertura — S25-T01.
          lines = hits = 0
          skip = False
          with open("coverage/lcov.info", encoding="utf-8") as fh:
              for line in fh:
                  if line.startswith("SF:"):
                      sf = line[3:].strip()
                      skip = sf.endswith(".g.dart") or sf.endswith(".freezed.dart")
                  elif line.startswith("LF:") and not skip:
                      lines += int(line[3:])
                  elif line.startswith("LH:") and not skip:
                      hits += int(line[3:])
          pct = (100 * hits / lines) if lines else 0.0
          print(f"Cobertura: {hits}/{lines} = {pct:.1f}%")
          if pct < 70:
              raise SystemExit(f"Cobertura {pct:.1f}% abaixo do minimo de 70%")
          EOF

  build:
    name: Build APK (debug smoke)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Code generation antes do build (necessario quando ha modelos freezed) — S25-T01.
      - name: Code generation (build_runner)
        run: dart run build_runner build

      - name: Prepare .env (from example)
        run: cp .env.example .env

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
