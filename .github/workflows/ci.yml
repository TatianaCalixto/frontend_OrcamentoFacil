name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  mobile:
    name: Mobile (analyze + test + coverage)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env e gitignored (segredo); o pubspec declara como asset, entao no CI
      # criamos a partir do exemplo para analyze/test/build encontrarem o asset.
      - name: Prepare .env (from example)
        run: cp .env.example .env

      - name: Analyze (gate)
        run: flutter analyze

      - name: Test (coverage)
        run: flutter test --coverage

      - name: Coverage gate (>= 70%)
        run: |
          python3 - <<'EOF'
          lines = hits = 0
          with open("coverage/lcov.info", encoding="utf-8") as fh:
              for line in fh:
                  if line.startswith("LF:"):
                      lines += int(line[3:])
                  elif line.startswith("LH:"):
                      hits += int(line[3:])
          pct = (100 * hits / lines) if lines else 0.0
          print(f"Cobertura: {hits}/{lines} = {pct:.1f}%")
          if pct < 70:
              raise SystemExit(f"Cobertura {pct:.1f}% abaixo do minimo de 70%")
          EOF

  build:
    name: Build APK (debug smoke)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare .env (from example)
        run: cp .env.example .env

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
